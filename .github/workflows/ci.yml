name: CI
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_DB: megabrain, POSTGRES_USER: megabrain, POSTGRES_PASSWORD: ci}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U megabrain -d megabrain"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q api clients core events integrations projects retrieval schemas storage scripts
      - run: python scripts/migrate.py
        env:
          MEGABRAIN_DATABASE_URL: postgresql://megabrain:***@localhost:5432/megabrain
      - run: pytest -q
        env:
          MEGABRAIN_DATABASE_URL: postgresql://megabrain:ci@localhost:5432/megabrain
          MEGABRAIN_REDIS_URL: redis://localhost:6379/0
      - run: ruff check api clients consolidation core events integrations projects retrieval schemas storage scripts megabrain_cli cli.py
