[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "megabrain-memory"
version = "0.1.0"
description = "Standalone durable memory service for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<7",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "pytest-cov>=5,<6"]
postgres = ["psycopg[binary]>=3.2,<4"]
redis = ["redis>=5,<7"]
embeddings = ["sentence-transformers>=3,<4", "onnxruntime>=1.18,<2"]
hermes = []

[project.scripts]
megabrain = "megabrain_cli.cli:main"
megabrain-migrate = "scripts.migrate:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "clients*", "consolidation*", "core*", "events*", "integrations*", "projects*", "retrieval*", "schemas*", "storage*", "scripts*", "megabrain*", "megabrain_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008", "B007", "B904", "B905", "E401", "E402", "E701", "E702", "E741", "UP031", "UP035"]  # Existing API compatibility and concise query-building code.
